[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "bookworm"
version = "0.2.0"
description = "Turn a folder of ebooks into a searchable, citable knowledge base: hybrid BM25 + vector search, grounded Q&A and an MCP server, all in one DuckDB file."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Joey Hersh" }]
requires-python = ">=3.11"
keywords = ["rag", "ebooks", "semantic-search", "bm25", "duckdb", "mcp", "epub", "retrieval"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Indexing",
    "Typing :: Typed",
]
dependencies = [
    "click>=8.1",
    "duckdb>=1.1",
    "httpx>=0.27",
    "rich>=13.7",
]

[project.optional-dependencies]
pdf = ["pypdf>=4.2"]
mobi = ["mobi>=0.3.3"]
fastembed = ["fastembed>=0.4"]
all = ["pypdf>=4.2", "mobi>=0.3.3", "fastembed>=0.4"]

[project.scripts]
bookworm = "bookworm.cli:main"

[project.urls]
Repository = "https://github.com/joey12725/bookworm"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pypdf>=4.2",
    "pytest>=8.2",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/bookworm"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "C4", "PTH", "RET"]
ignore = ["RUF001", "RUF002", "RUF003", "SIM905"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/bookworm"]

[[tool.mypy.overrides]]
module = ["pypdf.*", "mobi.*", "fastembed.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
